[package]
name = "open_texture_packer"
version = "0.3.1"
edition = "2021"
authors = ["Daisuke Takayama <info@webcyou.com>"]
description = "Open source and free Texture Packer tool written in rust."
license = "MIT"
repository = "https://github.com/webcyou-org/open-texture-packer"
homepage = "https://github.com/webcyou-org/open-texture-packer"
readme = "README.md"
exclude = ["assets", "docs", "examples/assets", "scripts", "wasm"]

[lib]
name = "open_texture_packer"
path = "src/lib.rs"

[[bin]]
name = "otp"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The `otp` command line tool.
cli = ["dep:clap", "images"]
# Loading sprites and writing sheets. Without it, only the packing engine is
# built, which is all that the WebAssembly build needs.
images = ["dep:image", "dep:log", "dep:serde_json"]

[dependencies]
image = { version = "^0.25", optional = true }
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0", optional = true }
clap = { version = "^4.5", features = ["derive"], optional = true }
log = { version = "^0.4.27", optional = true }
